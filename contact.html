<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanthainachai, Contact</title>
<meta name="description" content="Thanthai Nachai, painter and sculptor based in Bangkok.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23141414%22/><text x=%2250%22 y=%2268%22 font-size=%2256%22 text-anchor=%22middle%22 fill=%22%23ECEBE6%22 font-family=%22Helvetica,Arial%22 font-weight=%22700%22>T</text></svg>">
<style>
body{margin:0;background:#ECEBE6}
a{color:#141414}a:hover{color:#1F3FD1}
</style>
</head>
<body>
<div style="background: #ECEBE6; color: #141414; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; min-height: 100vh">

<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 32px; padding: 20px clamp(20px, 5vw, 64px); border-bottom: 1px solid #141414">
<a href="/" style="font-size: 22px; font-weight: 800; letter-spacing: 0.04em; text-decoration: none; color: #141414; padding: 10px 0">THANTHAINACHAI</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px">
<a href="/work" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; padding: 14px 16px; min-height: 44px; box-sizing: border-box">Work</a>
<a href="/about" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; padding: 14px 16px; min-height: 44px; box-sizing: border-box">About</a>
<a href="/contact" aria-current="page" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: underline; text-underline-offset: 6px; padding: 14px 16px; min-height: 44px; box-sizing: border-box">Contact</a>
</nav>
</header>

<main style="padding: clamp(56px, 8vw, 112px) clamp(20px, 5vw, 64px) clamp(64px, 8vw, 112px); max-width: 1440px; margin: 0 auto; box-sizing: border-box">
<h1 style="margin: 0 0 clamp(40px, 5vw, 72px); font-size: clamp(52px, 12vw, 184px); line-height: 0.9; letter-spacing: -0.03em; font-weight: 800; text-transform: uppercase">Contact</h1>
<div style="display: flex; flex-wrap: wrap; gap: 48px clamp(32px, 6vw, 96px); align-items: flex-start">

<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 32px">
<p style="margin: 0; font-size: clamp(20px, 1.8vw, 24px); line-height: 1.5">For painting, sculpture, mural and commissions, and enquiries about available works.</p>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 20px; border-top: 1px solid #141414"><span style="font-family: &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgb(85, 83, 78)">Email</span><a href="mailto:[YOUR EMAIL]" style="font-size: 22px; font-weight: 600; padding: 6px 0px">ozone3186@gmail.com</a></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 20px; border-top: 1px solid #141414"><span style="font-family: &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgb(85, 83, 78)">Instagram</span><a href="https://instagram.com/" style="font-size: 22px; font-weight: 600; padding: 6px 0px">Ozalamu</a></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 20px; border-top: 1px solid #141414">
<span style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #55534E">Based in</span>
<span style="font-size: 22px; font-weight: 600">Bangkok, Thailand</span>
</div>
</div>

<form style="flex: 1.4 1 460px; display: flex; flex-direction: column; gap: 28px; margin: 0">
<div style="display: flex; flex-wrap: wrap; gap: 28px 24px">
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 10px">
<label for="c-name" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase">Name</label>
<input id="c-name" type="text" autocomplete="name" style="min-height: 52px; padding: 0 16px; border: 1px solid #141414; background: #F6F5F1; font: inherit; font-size: 17px; color: #141414; box-sizing: border-box">
</div>
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 10px">
<label for="c-email" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase">Email</label>
<input id="c-email" type="email" autocomplete="email" style="min-height: 52px; padding: 0 16px; border: 1px solid #141414; background: #F6F5F1; font: inherit; font-size: 17px; color: #141414; box-sizing: border-box">
</div>
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 12px">
<legend style="padding: 0; margin-bottom: 12px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase">Project type</legend>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<label style="display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 18px; border: 1px solid #141414; font-size: 16px; cursor: pointer"><input type="radio" name="c-type" value="painting" style="accent-color: #ea2600; width: 18px; height: 18px; margin: 0">Painting / mural</label>
<label style="display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 18px; border: 1px solid #141414; font-size: 16px; cursor: pointer"><input type="radio" name="c-type" value="sculpture" style="accent-color: #ea2600; width: 18px; height: 18px; margin: 0">Sculpture</label>
<label style="display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 18px; border: 1px solid #141414; font-size: 16px; cursor: pointer"><input type="radio" name="c-type" value="other" style="accent-color: #ea2600; width: 18px; height: 18px; margin: 0">Other</label>
</div>
</fieldset>

<div style="display: flex; flex-wrap: wrap; gap: 28px 24px">
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 10px">
<label for="c-loc" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase">Location</label>
<input id="c-loc" type="text" style="min-height: 52px; padding: 0 16px; border: 1px solid #141414; background: #F6F5F1; font: inherit; font-size: 17px; color: #141414; box-sizing: border-box">
</div>
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 10px">
<label for="c-size" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase">Size (approx.)</label>
<input id="c-size" type="text" style="min-height: 52px; padding: 0 16px; border: 1px solid #141414; background: #F6F5F1; font: inherit; font-size: 17px; color: #141414; box-sizing: border-box">
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<label for="c-msg" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase">Message</label>
<textarea id="c-msg" rows="6" style="padding: 14px 16px; border: 1px solid #141414; background: #F6F5F1; font: inherit; font-size: 17px; line-height: 1.5; color: #141414; resize: vertical; box-sizing: border-box"></textarea>
</div>

<button type="button" style="align-self: flex-start; min-height: 56px; padding: 0 36px; border: 0; background: #ea2600; color: #FFFFFF; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer">Send message</button>
</form>

</div>
</main>

<footer style="background: #141414; color: #B9B7B0; padding: 24px clamp(20px, 5vw, 64px)">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px"><span>© 2026 Thanthai Nachai</span><span>Bangkok, Thailand</span></div>
</footer>

</div>
</body>
</html>
